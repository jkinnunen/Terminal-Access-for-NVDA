summary = "Terminalzugriff für NVDA"
description = """Bietet verbesserte Terminalzugänglichkeit für Windows Terminal und PowerShell, sodass Benutzer von Bildschirmleseprogrammen effizient navigieren und mit Befehlszeilenschnittstellen interagieren können. Inspiriert von TDSR (Terminal Data Structure Reader) und mit Funktionen von TDSR und Speakup. Erweiterte Funktionen, inspiriert durch Vorschläge und Diskussionen der Community."""
changelog = """v2.0.0-beta.10: diagnostic build for the search-result cursor issue. Adds temporary logging of where a search jump lands and whether the position holds, so the remaining bug can be pinned down from the NVDA log. No behavior change."""
