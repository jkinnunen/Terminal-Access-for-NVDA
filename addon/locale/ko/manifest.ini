summary = "터미널 접근을 위한 NVDA"
description = """Windows 터미널 및 PowerShell의 향상된 터미널 접근성을 제공하여, 스크린 리더 사용자가 명령줄 인터페이스를 효율적으로 탐색하고 상호작용할 수 있도록 합니다. TDSR(터미널 데이터 구조 리더)에서 영감을 받았으며 TDSR과 Speakup의 기능을 모두 통합합니다. 커뮤니티 제안 및 토론에서 영감을 받은 고급 기능을 제공합니다."""
changelog = """v2.0.0-beta.5: much faster search on large terminal buffers. The cleaned buffer is cached and reused until new output appears, so searching again is near-instant; color-code cleaning is skipped when there is none; and on a big buffer the matching runs off NVDA's main thread (it says "Searching" while it works) so the screen reader stays responsive."""
