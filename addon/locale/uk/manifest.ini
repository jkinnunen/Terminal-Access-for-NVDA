summary = "Доступ до терміналу для NVDA"
description = """Забезпечує покращену доступність терміналу для Windows Terminal та PowerShell, дозволяючи користувачам екранних зчитувачів ефективно переміщатися та взаємодіяти з інтерфейсами командного рядка. Натхненний TDSR (Terminal Data Structure Reader) та включає функціональність як TDSR, так і Speakup. Розширені функції натхненні пропозиціями та обговореннями спільноти."""
changelog = """v2.0.0-beta.9: search result activation now really keeps the review cursor on the matched line. NVDA itself rebinds the review cursor to the caret when focus returns to the terminal, so the add-on now re-applies the jump after focus settles. Also fixes search results being cleared the moment focus returned to the terminal, which broke find next and find previous after closing the results dialog."""
