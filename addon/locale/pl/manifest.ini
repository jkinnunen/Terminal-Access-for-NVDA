summary = "Dostęp do terminala dla NVDA"
description = """Zapewnia lepszą dostępność terminala dla Windows Terminal i PowerShell, umożliwiając użytkownikom czytników ekranu sprawną nawigację i interakcję z interfejsami wiersza poleceń. Zainspirowany TDSR (Terminal Data Structure Reader) i łączący w sobie funkcje zarówno TDSR, jak i Speakup. Zaawansowane funkcje zainspirowane sugestiami i dyskusjami społeczności."""
changelog = """v2.0.0-beta.6: adds search timing diagnostics. When a search takes longer than expected, a one-line breakdown is written to the NVDA log (read path, read time, cleaning time, match time) so a slow search can be diagnosed. No behavior change otherwise."""
