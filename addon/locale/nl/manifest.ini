summary = "Terminaltoegang voor NVDA"
description = """Biedt verbeterde terminaltoegankelijkheid voor Windows Terminal en PowerShell, waardoor gebruikers van schermlezers efficiënt kunnen navigeren en communiceren met opdrachtregelinterfaces. Geïnspireerd door TDSR (Terminal Data Structure Reader) en bevat functionaliteit van zowel TDSR als Speakup. Geavanceerde functies geïnspireerd door suggesties en discussies uit de gemeenschap."""
changelog = """v2.0.0-beta.15: the add-on is now pure Python. The native library and helper process were removed after field testing showed the Python reads are faster and more reliable, making the download much smaller and adding ARM64 support. The "Use native acceleration" setting is gone. No feature changes."""
