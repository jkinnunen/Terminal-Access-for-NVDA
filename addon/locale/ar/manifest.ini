summary = "الوصول إلى المحطة الطرفية لـ NVDA"
description = """يوفر إمكانية وصول محسّنة إلى Windows Terminal و PowerShell، مما يتيح لمستخدمي قارئ الشاشة التنقل والتفاعل بكفاءة مع واجهات سطر الأوامر. مستوحى من TDSR (Terminal Data Structure Reader) ويضم وظائف من كل من TDSR و Speakup. ميزات متقدمة مستوحاة من اقتراحات ومناقشات المجتمع."""
changelog = """v2.0.0-beta.14: confirms the search-result cursor fix and removes the temporary diagnostic logging. Activating a search result lands the review cursor on the matched line and keeps it there, so review-current-line reads the match."""
