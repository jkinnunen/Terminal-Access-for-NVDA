summary = "Terminál hozzáférés az NVDA számára"
description = """Fokozott terminál-hozzáférhetőséget biztosít a Windows Terminal és a PowerShell számára, lehetővé téve a képernyőolvasó felhasználók számára a parancssori felületeken való hatékony navigációt és interakciót. A TDSR (Terminal Data Structure Reader) ihlette, és mind a TDSR, mind a Speakup funkcióit magában foglalja. A közösség javaslatai és megbeszélései ihlette fejlett funkciók."""
changelog = """v2.0.0-beta.13: another fix for the review cursor not staying on the matched search line. The search results were being cleared as focus returned to the terminal, so the re-apply had nothing to jump to. The add-on now remembers the matched line's text and re-applies the review position from that directly."""
