summary = "Accès au terminal pour NVDA"
description = """Améliore l'accessibilité des terminaux Windows Terminal et PowerShell, permettant aux utilisateurs de lecteurs d'écran de naviguer et d'interagir efficacement avec les interfaces en ligne de commande. Inspiré par TDSR (Terminal Data Structure Reader), il intègre les fonctionnalités de TDSR et Speakup. Fonctionnalités avancées inspirées des suggestions et des discussions de la communauté."""
changelog = """v2.0.0-beta.13: another fix for the review cursor not staying on the matched search line. The search results were being cleared as focus returned to the terminal, so the re-apply had nothing to jump to. The add-on now remembers the matched line's text and re-applies the review position from that directly."""
