summary = "Acesso ao terminal para NVDA"
description = """Oferece acessibilidade aprimorada ao terminal para o Windows Terminal e o PowerShell, permitindo que usuários de leitores de tela naveguem e interajam com eficiência com interfaces de linha de comando. Inspirado no TDSR (Terminal Data Structure Reader) e incorpora funcionalidades do TDSR e do Speakup. Recursos avançados inspirados em sugestões e discussões da comunidade."""
changelog = """v2.0.0-beta: 24 bug fixes across Python and Rust, 36 fuzz tests, privacy settings panel, ANSI stripping hardened across all speech output paths, combining character support in column extraction, config validation for all settings keys."""
