summary = "Accesso al terminale per NVDA"
description = """Fornisce una maggiore accessibilità al terminale per Windows Terminal e PowerShell, consentendo agli utenti di screen reader di navigare e interagire in modo efficiente con le interfacce a riga di comando. Ispirato a TDSR (Terminal Data Structure Reader), incorpora funzionalità sia di TDSR che di Speakup. Funzionalità avanzate ispirate dai suggerimenti e dalle discussioni della comunità."""
changelog = """v2.0.0-beta.6: adds search timing diagnostics. When a search takes longer than expected, a one-line breakdown is written to the NVDA log (read path, read time, cleaning time, match time) so a slow search can be diagnosed. No behavior change otherwise."""
