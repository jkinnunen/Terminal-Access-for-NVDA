summary = "终端访问（适用于NVDA）"
description = """为 Windows 终端和 PowerShell 提供增强的终端可访问性，使屏幕阅读器用户能够高效地导航和交互命令行界面。该方案受 TDSR（终端数据结构阅读器）启发，融合了 TDSR 与 Speakup 的功能特性。其高级功能源于社区建议与讨论的成果。"""
changelog = """v2.0.0-beta.4: safety and reliability hardening. Terminal search and error sound cues can no longer be frozen by a program that prints an extremely long line with no line breaks, the saved issue report is protected against crafted window titles, and the two open-URL paths now share one scheme-safety check. Also fixes progress-percent announcements reading the wrong terminal and a rare helper-restart race."""
