summary = "Доступ к терминалу для NVDA"
description = """Обеспечивает расширенную доступность терминала для Windows Terminal и PowerShell, позволяя пользователям экранных считывающих устройств эффективно перемещаться по интерфейсам командной строки и взаимодействовать с ними. Вдохновлен TDSR (Terminal Data Structure Reader) и включает в себя функциональность как TDSR, так и Speakup. Расширенные функции вдохновлены предложениями и обсуждениями сообщества."""
changelog = """v2.0.1: fixes the 2.0.0 package missing the user guide (NVDA+Shift+F1 did nothing) and all translations. Install this over 2.0.0. Everything else is 2.0.0: AI CLI support, semantic navigation, table mode, faster and more reliable search, and a pure Python add-on with ARM64 support."""
