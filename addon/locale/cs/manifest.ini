summary = "Přístup k terminálu pro NVDA"
description = """Poskytuje vylepšenou přístupnost terminálu pro Windows Terminal a PowerShell, což uživatelům čteček obrazovky umožňuje efektivní navigaci a interakci s rozhraními příkazového řádku. Inspirováno TDSR (Terminal Data Structure Reader) a zahrnuje funkce jak z TDSR, tak ze Speakup. Pokročilé funkce inspirované návrhy a diskusemi komunity."""
changelog = """v2.0.0: major release. Adds AI CLI support (conversation turn and code block navigation, streaming deltas, AI error tones), semantic section navigation, table mode for columnar output, a search results dialog with fuzzy matching, command finder, transcript export, issue reporting, first-run tutorial, profile editor, and sound settings. Now pure Python: faster, a much smaller download, and ARM64 support. Fixes a machine freeze during find and the search cursor landing on the wrong line."""
