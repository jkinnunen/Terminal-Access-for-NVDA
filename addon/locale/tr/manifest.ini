summary = "NVDA için Terminal Erişimi"
description = """Windows Terminal ve PowerShell için gelişmiş terminal erişilebilirliği sağlayarak, ekran okuyucu kullanıcılarının komut satırı arayüzlerinde verimli bir şekilde gezinmelerini ve etkileşim kurmalarını sağlar. TDSR (Terminal Data Structure Reader) tarafından ilham alınarak geliştirilmiş olup, hem TDSR hem de Speakup'ın işlevselliğini bünyesinde barındırır. Topluluk önerileri ve tartışmalarından ilham alan gelişmiş özellikler."""
changelog = """v2.0.0-beta.12: the review cursor now stays on the matched search line. NVDA moves the review cursor to the caret while switching focus back to the terminal, overriding the jump, so the add-on now re-applies the jump just after the focus switch finishes rather than during it."""
