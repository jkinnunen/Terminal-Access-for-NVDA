summary = "Acceso a la terminal para NVDA"
description = """Proporciona una accesibilidad mejorada a Windows Terminal y PowerShell, lo que permite a los usuarios de lectores de pantalla navegar e interactuar de manera eficiente con las interfaces de línea de comandos. Inspirado en TDSR (Terminal Data Structure Reader) e incorpora funcionalidades tanto de TDSR como de Speakup. Funciones avanzadas inspiradas en las sugerencias y debates de la comunidad."""
changelog = """v2.0.0-beta: 24 bug fixes across Python and Rust, 36 fuzz tests, privacy settings panel, ANSI stripping hardened across all speech output paths, combining character support in column extraction, config validation for all settings keys."""
