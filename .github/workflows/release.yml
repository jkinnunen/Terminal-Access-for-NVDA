name: Build and Release Add-on

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Build and release the NVDA addon (pure Python) ──────────
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          pip install scons markdown
          # msgfmt (gettext) compiles the 17 translation catalogs to .mo
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Extract version from buildVars.py
        id: version
        run: |
          if [ ! -f buildVars.py ]; then
            echo "Error: buildVars.py not found" >&2
            exit 1
          fi

          VERSION=$(python3 -c "
          import re, sys
          with open('buildVars.py') as f:
              m = re.search(r'addon_version\s*=\s*[\"\\x27]([^\"\\x27]+)[\"\\x27]', f.read())
          if m:
              print(m.group(1))
          else:
              print('Error: addon_version not found in buildVars.py', file=sys.stderr)
              sys.exit(1)
          ")

          if [ $? -ne 0 ]; then
            echo "Error: Failed to extract version from buildVars.py" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # A semver pre-release (has a hyphen, e.g. 2.0.0-beta.2) is marked
          # as a GitHub pre-release; a plain version (e.g. 2.0.0) is a full release.
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist"
          fi

      - name: Build add-on
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # The real SCons build: converts the guide to HTML, compiles the
          # .po catalogs to .mo, generates manifests, and packages. The old
          # build.py zipper shipped packages without the HTML guide or any
          # compiled translations (broke NVDA+Shift+F1 in 2.0.0).
          scons
          ls -lh *.nvda-addon

      - name: Verify package completeness
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="terminalAccess-$VERSION.nvda-addon"
          python3 - "$PKG" <<'EOF'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          required = ["manifest.ini", "doc/en/readme.html", "doc/en/readme.md"]
          missing = [r for r in required if r not in names]
          mo_count = sum(1 for n in names if n.endswith(".mo"))
          if mo_count < 17:
              missing.append(f"compiled translations: {mo_count}/17 .mo files")
          if missing:
              print("PACKAGE INCOMPLETE:", ", ".join(missing))
              sys.exit(1)
          print(f"Package OK: {len(names)} files, {mo_count} translations, HTML guide present")
          EOF

      - name: Generate changelog for release
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version: skip [Unreleased], find
            # ## [VERSION], capture until the next ## [ heading.
            CHANGELOG=$(awk -v ver="$VERSION" '
              /^## \[Unreleased\]/ { next }
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release version $VERSION"
            fi
          else
            CHANGELOG="Release version $VERSION"
          fi
          echo "$CHANGELOG" > changelog.txt
          echo "--- Changelog for v$VERSION ---"
          cat changelog.txt

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            terminalAccess-${{ steps.version.outputs.version }}.nvda-addon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          git tag -a latest -m "Latest release: v${{ steps.version.outputs.version }}"
          git push origin latest

          echo "Updated 'latest' tag to point to v${{ steps.version.outputs.version }}"

      - name: Skip release (tag exists)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Release v${{ steps.version.outputs.version }} already exists. Skipping release creation."
